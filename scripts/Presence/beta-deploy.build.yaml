version: 0.2

phases:
  pre_build:
    commands:
      # Configure git to use GITHUB_TOKEN for authentication with submodules
      - echo "[DEBUG] Checking GITHUB_TOKEN availability..."
      - |
        if [ -n "$GITHUB_TOKEN" ]; then
          echo "[DEBUG] GITHUB_TOKEN is set (length: ${#GITHUB_TOKEN} chars)"
        else
          echo "[ERROR] GITHUB_TOKEN is not set!"
          exit 1
        fi
      - echo "[DEBUG] Configuring git to use HTTPS with token authentication..."
      - git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
      - echo "[DEBUG] Git URL rewrite configuration applied"
      - git config --global --list | grep url || echo "[DEBUG] No URL rewrites found"
      - echo "[DEBUG] Current directory: $(pwd)"
      - echo "[DEBUG] Listing .gitmodules content:"
      - cat .gitmodules || echo "[WARNING] No .gitmodules file found"
      - echo "[DEBUG] Initializing submodules recursively..."
      - git submodule update --init --recursive
      - echo "[DEBUG] Submodule initialization complete"
      - git submodule status
  build:
    commands:
      - curl -fsSL https://get.jetpack.io/devbox | bash -s -- --force
      - devbox run ./scripts/Presence/beta-deploy.sh
