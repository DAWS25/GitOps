# aws cloudformation deploy --stack-name presence-beta-deploy-role --template-file scripts/Presence/beta-deploy-role.cform.yaml --capabilities CAPABILITY_NAMED_IAM
AWSTemplateFormatVersion: 2010-09-09
Description: IAM Role for Presence beta deployment CodeBuild project

Parameters:
  ProjectName:
    Type: String
    Default: presence-beta-deploy
    Description: Name of the CodeBuild project

Resources:
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess

Outputs:
  CodeBuildServiceRoleArn:
    Description: CodeBuild service role ARN
    Value: !GetAtt CodeBuildServiceRole.Arn
    Export:
      Name: !Sub "${ProjectName}-role-arn"

  CodeBuildServiceRoleName:
    Description: CodeBuild service role name
    Value: !Ref CodeBuildServiceRole
    Export:
      Name: !Sub "${ProjectName}-role-name"
