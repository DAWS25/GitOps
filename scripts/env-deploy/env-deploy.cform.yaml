# aws cloudformation deploy --stack-name env-deploy --template-file scripts/env-deploy/env-deploy.cform.yaml --capabilities CAPABILITY_IAM
AWSTemplateFormatVersion: 2010-09-09
Description: CodeBuild project for environment deployment

Parameters:
  ProjectName:
    Type: String
    Default: env-deploy
    Description: Name of the CodeBuild project

  SourceRepository:
    Type: String
    Default: https://github.com/DAWS25/GitOps.git
    Description: Source repository URL

  SecretsRepository:
    Type: String
    Default: https://github.com/DAWS25/GitOps-Secrets.git
    Description: Secrets repository URL

  SourceBranch:
    Type: String
    Default: main
    Description: Source branch to build

  BuildSpec:
    Type: String
    Default: scripts/env-deploy/env-deploy.buildspec.yaml
    Description: Path to the buildspec file

  ComputeType:
    Type: String
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
    Description: CodeBuild compute type

  BuildImage:
    Type: String
    Default: aws/codebuild/amazonlinux2-x86_64-standard:5.0
    Description: CodeBuild Docker image

  ServiceRoleExport:
    Type: String
    Default: codebuild-general-role-arn
    Description: CloudFormation export name for the CodeBuild service role ARN

  GitHubTokenSecret:
    Type: String
    Default: GITHUB_TOKEN
    Description: Secrets Manager secret name containing the GitHub personal access token

  NixEfsName:
    Type: String
    Default: nix-efs
    Description: Name of the Nix EFS stack (used to import exported values)

  EnvGrade:
    Type: String
    Default: alpha
    Description: Environment grade (e.g. alpha, beta, prod)

  EnvProject:
    Type: String
    Default: project
    Description: Project name for the environment deployment

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for CodeBuild to access EFS

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for CodeBuild VPC configuration

Resources:
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      Description: !Sub "${ProjectName} build project"
      ServiceRole:
        Fn::ImportValue: !Ref ServiceRoleExport
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref ComputeType
        Image: !Ref BuildImage
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV_GRADE
            Value: !Ref EnvGrade
          - Name: ENV_PROJECT
            Value: !Ref EnvProject
          - Name: GITHUB_TOKEN
            Type: SECRETS_MANAGER
            Value: !Ref GitHubTokenSecret
      Source:
        Type: GITHUB
        Location: !Ref SourceRepository
        BuildSpec: !Ref BuildSpec
        GitCloneDepth: 1
      SourceVersion: !Ref SourceBranch
      SecondarySources:
        - Type: GITHUB
          SourceIdentifier: GitOps_Secrets
          Location: !Ref SecretsRepository
          GitCloneDepth: 1
      SecondarySourceVersions:
        - SourceIdentifier: GitOps_Secrets
          SourceVersion: !Ref SourceBranch
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${NixEfsName}-sg-id"
      FileSystemLocations:
        - Type: EFS
          Location: !Sub
            - "${FileSystemId}.efs.${AWS::Region}.amazonaws.com:/nix"
            - FileSystemId:
                Fn::ImportValue: !Sub "${NixEfsName}-id"
          MountPoint: /nix
          Identifier: nix_cache
          MountOptions: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 60
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}"
      Tags:
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  CodeBuildProjectName:
    Description: CodeBuild project name
    Value: !Ref CodeBuildProject
    Export:
      Name: !Sub "env-deploy-name"

  CodeBuildProjectArn:
    Description: CodeBuild project ARN
    Value: !GetAtt CodeBuildProject.Arn
    Export:
      Name: !Sub "env-deploy-arn"
