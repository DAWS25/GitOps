version: 0.2

phases:
  pre_build:
    commands:
      # Configure git to use GITHUB_TOKEN for authentication with submodules
      - git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
      - git submodule update --init --recursive
  build:
    commands:
      # 1. adicionar o clone no script de deploy
      # 2. adicionar o repo como sub modulo do git
      - ./modules/Presence/scripts/beta-deploy.sh
