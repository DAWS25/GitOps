AWSTemplateFormatVersion: 2010-09-09
Description: Minimal EKS cluster for GitOps with Fargate

Parameters:
  TenantId:
    Type: String
    Default: gitops
    Description: Tenant identifier used to namespace resource and export names
    AllowedPattern: "[a-z0-9-]+"

  ClusterName:
    Type: String
    Default: eks-cluster
    Description: Base EKS cluster name (TenantId is prepended)

  ClusterVersion:
    Type: String
    Default: "1.35"
    Description: Kubernetes version for EKS cluster (latest default)
    AllowedValues:
      - "1.33"
      - "1.34"
      - "1.35"

  FargateProfileName:
    Type: String
    Default: eks-fargate-profile-v3
    Description: Base Fargate profile name (TenantId is prepended)

Resources:
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${TenantId}-${ClusterName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EksClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for GitOps EKS cluster
      VpcId: !ImportValue
        Fn::Sub: "${TenantId}-gitops-vpc-id"

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "${TenantId}-${ClusterName}"
      Version: !Ref ClusterVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        SecurityGroupIds:
          - !Ref EksClusterSecurityGroup
        SubnetIds: !Split
          - ","
          - !ImportValue
            Fn::Sub: "${TenantId}-gitops-vpc-private-subnet-ids"
        EndpointPublicAccess: true
        EndpointPrivateAccess: true

  FargatePodExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${TenantId}-${ClusterName}-fargate-pod-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks-fargate-pods.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy

  DefaultFargateProfile:
    Type: AWS::EKS::FargateProfile
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EksCluster
      FargateProfileName: !Sub "${TenantId}-${FargateProfileName}"
      PodExecutionRoleArn: !GetAtt FargatePodExecutionRole.Arn
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: "${TenantId}-gitops-vpc-private-subnet-ids"
      Selectors:
        - Namespace: default
        - Namespace: kube-system

  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: DefaultFargateProfile
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  MetricsServerAddon:
    Type: AWS::EKS::Addon
    DependsOn: DefaultFargateProfile
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: metrics-server
      ResolveConflicts: OVERWRITE

  SnapshotControllerAddon:
    Type: AWS::EKS::Addon
    DependsOn: DefaultFargateProfile
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: snapshot-controller
      ResolveConflicts: OVERWRITE

  AwsLoadBalancerControllerAddon:
    Type: AWS::EKS::Addon
    DependsOn: DefaultFargateProfile
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: aws-load-balancer-controller
      ResolveConflicts: OVERWRITE

Outputs:
  EksClusterName:
    Description: EKS cluster name
    Value: !Ref EksCluster
    Export:
      Name: !Sub "${TenantId}-${ClusterName}-cluster-name"

  EksClusterArn:
    Description: EKS cluster ARN
    Value: !GetAtt EksCluster.Arn
    Export:
      Name: !Sub "${TenantId}-${ClusterName}-cluster-arn"

  EksClusterEndpoint:
    Description: EKS cluster endpoint
    Value: !GetAtt EksCluster.Endpoint
    Export:
      Name: !Sub "${TenantId}-${ClusterName}-endpoint"

  EksClusterSecurityGroupId:
    Description: EKS cluster security group ID
    Value: !Ref EksClusterSecurityGroup
    Export:
      Name: !Sub "${TenantId}-${ClusterName}-cluster-sg-id"

  FargateProfileArn:
    Description: Default Fargate profile ARN
    Value: !Ref DefaultFargateProfile
    Export:
      Name: !Sub "${TenantId}-${ClusterName}-fargate-profile-arn"
