# aws cloudformation deploy --stack-name gitops-vpc --template-file daws25/gitops-vpc/gitops-vpc.cform.yaml
AWSTemplateFormatVersion: 2010-09-09
Description: VPC with 3 public subnets across AZs for GitOps build tasks

Parameters:
  VpcName:
    Type: String
    Default: gitops-vpc
    Description: Name tag for the VPC

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: CIDR block for the VPC

  PublicSubnet0Cidr:
    Type: String
    Default: 10.20.0.0/24
    Description: CIDR for public subnet in AZ 0

  PublicSubnet1Cidr:
    Type: String
    Default: 10.20.1.0/24
    Description: CIDR for public subnet in AZ 1

  PublicSubnet2Cidr:
    Type: String
    Default: 10.20.2.0/24
    Description: CIDR for public subnet in AZ 2

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref VpcName
        - Key: ManagedBy
          Value: CloudFormation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${VpcName}-igw"
        - Key: ManagedBy
          Value: CloudFormation

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${VpcName}-public-rt"
        - Key: ManagedBy
          Value: CloudFormation

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet0:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet0Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${VpcName}-public-0"
        - Key: ManagedBy
          Value: CloudFormation

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${VpcName}-public-1"
        - Key: ManagedBy
          Value: CloudFormation

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${VpcName}-public-2"
        - Key: ManagedBy
          Value: CloudFormation

  AssocPublicSubnet0:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet0
      RouteTableId: !Ref PublicRouteTable

  AssocPublicSubnet1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  AssocPublicSubnet2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${VpcName}-id"

  PublicSubnet0Id:
    Description: Public subnet 0 ID
    Value: !Ref PublicSubnet0
    Export:
      Name: !Sub "${VpcName}-public-0-id"

  PublicSubnet1Id:
    Description: Public subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${VpcName}-public-1-id"

  PublicSubnet2Id:
    Description: Public subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${VpcName}-public-2-id"

  PublicSubnetIds:
    Description: Comma-separated list of all public subnet IDs
    Value: !Join
      - ","
      - - !Ref PublicSubnet0
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
    Export:
      Name: !Sub "${VpcName}-public-subnet-ids"

  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway
    Export:
      Name: !Sub "${VpcName}-igw-id"

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub "${VpcName}-public-rt-id"
