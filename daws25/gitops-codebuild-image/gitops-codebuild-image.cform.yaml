AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repository for the GitOps CodeBuild custom image

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: gitops-codebuild-image
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: gitops-codebuild-image-uri
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export:
      Name: gitops-codebuild-image-arn
