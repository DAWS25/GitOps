# aws cloudformation deploy --stack-name build-runner --template-file codebuild/build-runner/010-codebuild-runner.cform.yaml --capabilities CAPABILITY_IAM
AWSTemplateFormatVersion: 2010-09-09
Description: CodeBuild project for script runner

Parameters:
  TenantId:
    Type: String
    Default: main-tenant
    Description: Tenant ID for shared resources (e.g. VPC, DB)

  EnvId:
    Type: String
    Default: main-env
    Description: Environment ID for deployment (e.g. blue, green)

  ProjectName:
    Type: String
    Default: !Sub "${TenantId}-${EnvId}-build-runner"
    Description: Name of the CodeBuild project for the build runner

  SourceRepository:
    Type: String
    Default: https://github.com/DAWS25/GitOps.git
    Description: Source repository URL

  SecretsRepository:
    Type: String
    Default: https://github.com/DAWS25/GitOps-Secrets.git
    Description: Secrets repository URL

  SourceBranch:
    Type: String
    Default: main
    Description: Source branch to build

  BuildSpec:
    Type: String
    Default: codebuild/build-runner/build-runner.buildspec.yaml
    Description: Path to the buildspec file

  ComputeType:
    Type: String
    Default: BUILD_GENERAL1_MEDIUM
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
      - BUILD_GENERAL1_XLARGE
      - BUILD_GENERAL1_2XLARGE
      - BUILD_LAMBDA_1GB
      - BUILD_LAMBDA_2GB
      - BUILD_LAMBDA_4GB
      - BUILD_LAMBDA_8GB
      - BUILD_LAMBDA_10GB
    Description: CodeBuild compute type

  BuildImage:
    Type: String
    Default: aws/codebuild/standard:5.0
    Description: Custom Docker image URI (e.g. ECR image)

  ServiceRoleExport:
    Type: String
    Default: codebuild-general-role-arn
    Description: CloudFormation export name for the CodeBuild service role ARN

  GitHubTokenSecret:
    Type: String
    Default: GITHUB_TOKEN
    Description: Secrets Manager secret name containing the GitHub personal access token

  EnvGrade:
    Type: String
    Default: alpha
    Description: Environment grade (e.g. alpha, beta, prod)

  EnvProject:
    Type: String
    Default: project
    Description: Project name for the environment deployment

  GitOpsVpcName:
    Type: String
    Default: gitops-vpc
    Description: Name of the GitOps VPC stack (used to import exported values)

  TenantId:
    Type: String
    Default: presence-env
    Description: Tenant ID for shared account-level resources (VPC, DB)

  NixEfsName:
    Type: String
    Default: nix-efs
    Description: Name of the Nix EFS stack (used to import exported values)

Resources:
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      Description: !Sub "${ProjectName} build project"
      ServiceRole:
        Fn::ImportValue: !Ref ServiceRoleExport
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref ComputeType
        Image: !Ref BuildImage
        ImagePullCredentialsType: SERVICE_ROLE
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV_GRADE
            Value: !Ref EnvGrade
          - Name: ENV_PROJECT
            Value: !Ref EnvProject
          - Name: TENANT_ID
            Value: !Ref TenantId
          - Name: GITHUB_TOKEN
            Type: SECRETS_MANAGER
            Value: !Ref GitHubTokenSecret
      Source:
        Type: GITHUB
        Location: !Ref SourceRepository
        BuildSpec: !Ref BuildSpec
        GitCloneDepth: 1
      SourceVersion: !Ref SourceBranch
      SecondarySources:
        - Type: GITHUB
          SourceIdentifier: GitOps_Secrets
          Location: !Ref SecretsRepository
          GitCloneDepth: 1
      SecondarySourceVersions:
        - SourceIdentifier: GitOps_Secrets
          SourceVersion: !Ref SourceBranch
      VpcConfig:
        VpcId:
          Fn::ImportValue: !Sub "${GitOpsVpcName}-id"
        Subnets:
          - Fn::ImportValue: !Sub "${GitOpsVpcName}-private-id"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${NixEfsName}-sg-id"
      FileSystemLocations:
        - Type: EFS
          Location: !Sub
            - "${FileSystemId}.efs.${AWS::Region}.amazonaws.com:/"
            - FileSystemId:
                Fn::ImportValue: !Sub "${NixEfsName}-id"
          MountPoint: /nix
          Identifier: nix_cache
          MountOptions: nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 60
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${ProjectName}"
      Tags:
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  CodeBuildProjectName:
    Description: CodeBuild project name
    Value: !Ref CodeBuildProject
    Export:
      Name: !Sub "env-deploy-name"

  CodeBuildProjectArn:
    Description: CodeBuild project ARN
    Value: !GetAtt CodeBuildProject.Arn
    Export:
      Name: !Sub "env-deploy-arn"
