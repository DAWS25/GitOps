AWSTemplateFormatVersion: '2010-09-09'
Description: Route53 delegation for custom domain

Parameters:
  TenantId:
    Type: String
    Default: main
    Description: Tenant identifier used to prefix exported outputs.

  DomainName:
    Type: String
    Description: Custom domain name for the CloudFront distribution (e.g., www.example.com)
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9-_.]*[a-zA-Z0-9]$

  ParentHostedZoneId:
    Type: String
    Description: Route53 Hosted Zone ID for the domain

Resources:
  # Route53 Record for custom domain
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref ParentHostedZoneId
      Name: 
        Fn::ImportValue: !Sub "${TenantId}-DomainName"
      Type: NS
      TTL: '300'
      ResourceRecords:
        Fn::Split:
          - ","
          - Fn::ImportValue: !Sub "${TenantId}-NameServers"

Outputs:
  DelegationRecord:
    Description: NS record for delegating the domain to the hosted zone
    Value:
      Fn::ImportValue: !Sub "${TenantId}-NameServers"
    Export:
      Name: !Sub "${TenantId}-DelegationRecord"
      