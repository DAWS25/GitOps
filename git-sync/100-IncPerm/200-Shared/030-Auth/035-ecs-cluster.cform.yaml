Description: ECS Cluster

Parameters:
  TenantId:
    Type: String
    Default: project
  
  ContainerInsights:
    Type: String
    Default: enabled
    AllowedValues:
      - enabled
      - disabled
    Description: Enable or disable container insights

Resources:
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${TenantId}-ecs-cluster'
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: !Ref ContainerInsights
      Tags:
        - Key: TenantId
          Value: !Ref TenantId

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${TenantId}-ecs-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: TenantId
          Value: !Ref TenantId

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${TenantId}/default'
      RetentionInDays: 14

Outputs:
  ECSClusterName:
    Description: The name of the ECS Cluster
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${TenantId}-ECSClusterName'

  ECSClusterArn:
    Description: The ARN of the ECS Cluster
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub '${TenantId}-ECSClusterArn'

  ExecutionRoleArn:
    Description: The ARN of the ECS Task Execution Role
    Value: !GetAtt ExecutionRole.Arn
    Export:
      Name: !Sub '${TenantId}-ExecutionRoleArn'

  AppLogGroupArn:
    Description: The ARN of the Application Log Group
    Value: !GetAtt AppLogGroup.Arn
    Export:
      Name: !Sub '${TenantId}-AppLogGroupArn'

  AppLogGroupName:
    Description: The name of the Application Log Group
    Value: !Ref AppLogGroup
    Export:
      Name: !Sub '${TenantId}-AppLogGroupName'