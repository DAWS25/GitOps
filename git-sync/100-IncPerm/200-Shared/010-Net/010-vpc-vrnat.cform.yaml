Description: VPC networking for High-Availability (3 AZs) - Public and Isolated Subnets

Parameters:
  TenantId:
    Type: String
    Default: IncPerm

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
  
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.4.0/24
  
  PublicSubnet3Cidr:
    Type: String
    Default: 10.0.7.0/24
  
  IsolatedSubnet1Cidr:
    Type: String
    Default: 10.0.2.0/24
  
  IsolatedSubnet2Cidr:
    Type: String
    Default: 10.0.5.0/24
  
  IsolatedSubnet3Cidr:
    Type: String
    Default: 10.0.8.0/24

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-vpc-services
        - Key: TenantId
          Value: !Sub ${TenantId}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-igw
        - Key: TenantId
          Value: !Sub ${TenantId}

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-public-rt
        - Key: TenantId
          Value: !Sub ${TenantId}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  IsolatedRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-isolated-rt
        - Key: Isolation
          Value: isolated
        - Key: TenantId
          Value: !Sub ${TenantId}

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-public-a
        - Key: Tier
          Value: public
        - Key: TenantId
          Value: !Sub ${TenantId}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-public-b
        - Key: Tier
          Value: public
        - Key: TenantId
          Value: !Sub ${TenantId}

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-public-c
        - Key: Tier
          Value: public
        - Key: TenantId
          Value: !Sub ${TenantId}

  IsolatedSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-isolated-a
        - Key: TenantId
          Value: !Sub ${TenantId}

  IsolatedSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-isolated-b
        - Key: TenantId
          Value: !Sub ${TenantId}

  IsolatedSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-isolated-c
        - Key: TenantId
          Value: !Sub ${TenantId}

  AssocPublicSubnet1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  AssocPublicSubnet2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable
  AssocPublicSubnet3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  AssocIsolatedSubnet1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet1
      RouteTableId: !Ref IsolatedRouteTable
  AssocIsolatedSubnet2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet2
      RouteTableId: !Ref IsolatedRouteTable
  AssocIsolatedSubnet3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet3
      RouteTableId: !Ref IsolatedRouteTable

Outputs:
  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub ${TenantId}-VpcId

  InternetGatewayId:
    Value: !Ref InternetGateway
    Export:
      Name: !Sub ${TenantId}-InternetGatewayId

  PublicRouteTableId:
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub ${TenantId}-PublicRouteTableId

  IsolatedRouteTableId:
    Value: !Ref IsolatedRouteTable
    Export:
      Name: !Sub ${TenantId}-IsolatedRouteTableId

  PublicSubnetIds:
    Value:
      !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
    Export:
      Name: !Sub ${TenantId}-PublicSubnetIds

  IsolatedSubnetIds:
    Value:
      !Join [
        ",",
        [!Ref IsolatedSubnet1, !Ref IsolatedSubnet2, !Ref IsolatedSubnet3],
      ]
    Export:
      Name: !Sub ${TenantId}-IsolatedSubnetIds

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${TenantId}-PublicSubnet1Id
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${TenantId}-PublicSubnet2Id
  PublicSubnet3Id:
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub ${TenantId}-PublicSubnet3Id

  IsolatedSubnet1Id:
    Value: !Ref IsolatedSubnet1
    Export:
      Name: !Sub ${TenantId}-IsolatedSubnet1Id
  IsolatedSubnet2Id:
    Value: !Ref IsolatedSubnet2
    Export:
      Name: !Sub ${TenantId}-IsolatedSubnet2Id
  IsolatedSubnet3Id:
    Value: !Ref IsolatedSubnet3
    Export:
      Name: !Sub ${TenantId}-IsolatedSubnet3Id
