AWSTemplateFormatVersion: '2010-09-09'
Description: Route53 hosted zone for custom domain

Parameters:
  TenantId:
    Type: String
    Default: main
    Description: Tenant identifier used to prefix exported outputs.

  DomainName:
    Type: String
    Description: Custom domain name for the zone
    AllowedPattern: ^[a-zA-Z0-9][a-zA-Z0-9-_.]*[a-zA-Z0-9]$

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "Hosted zone for ${DomainName}"

Outputs:
  DomainName:
    Description: Custom domain name for the hosted zone
    Value: !Ref DomainName
    Export:
      Name: !Sub "${TenantId}-DomainName"

  ZoneId:
    Description: Hosted Zone ID for the custom domain
    Value: !Ref HostedZone
    Export:
      Name: !Sub "${TenantId}-HostedZoneId"

  NameServers:
    Description: Name server list for the hosted zone (comma-separated)
    Value: !Join [",", !GetAtt HostedZone.NameServers]
    Export:
      Name: !Sub "${TenantId}-NameServers"


  URL:
    Description: Primary URL
    Value: !Sub "https://${DomainName}"
    Export:
      Name: !Sub "${TenantId}-CertificateURL"

  HealthCheckURL:
    Description: Health check URL
    Value: !Sub "https://${DomainName}/health"
    Export:
      Name: !Sub "${TenantId}-CertificateHealthCheckURL"

  HealthCheckCmd:
    Description: Health check command
    Value: !Sub "curl -kv https://${DomainName}/health"
    Export:
      Name: !Sub "${TenantId}-CertificateHealthCheckCmd"
