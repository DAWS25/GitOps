AWSTemplateFormatVersion: 2010-09-09
Description: GitHub source credentials - Secrets Manager secret and CodeBuild registration

Parameters:
  TenantId:
    Type: String
    Default: GitOps
    Description: Tenant ID for shared resources

  EnvId:
    Type: String
    Default: Main
    Description: Environment ID

  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub personal access token (classic PAT or OAuth token with repo scope)

  GitHubTokenSecretName:
    Type: String
    Default: GITHUB_TOKEN
    Description: Name of the Secrets Manager secret to store the GitHub token

Resources:
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref GitHubTokenSecretName
      Description: GitHub PAT for CodeBuild source authentication
      SecretString: !Ref GitHubToken
      Tags:
        - Key: TenantId
          Value: !Ref TenantId
        - Key: EnvId
          Value: !Ref EnvId

  GitHubSourceCredential:
    Type: AWS::CodeBuild::SourceCredential
    DependsOn: GitHubTokenSecret
    Properties:
      AuthType: PERSONAL_ACCESS_TOKEN
      ServerType: GITHUB
      Token: !Sub "{{resolve:secretsmanager:${GitHubTokenSecretName}}}"

Outputs:
  GitHubTokenSecretArn:
    Description: ARN of the GitHub token secret
    Value: !Ref GitHubTokenSecret
    Export:
      Name: !Sub ${TenantId}-${EnvId}-GitHubTokenSecretArn

  GitHubTokenSecretName:
    Description: Name of the GitHub token secret
    Value: !Ref GitHubTokenSecretName
    Export:
      Name: !Sub ${TenantId}-${EnvId}-GitHubTokenSecretName
