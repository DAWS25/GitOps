Description: EC2 instance running k3s [1517]

Parameters:
  TenantId:
    Type: String
    Default: Main
  
  EnvId:
    Type: String
    Default: Main

  InstanceType:
    Type: String
    Default: t4g.small

  AmiSsmParameter:
    Type: String
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: SSM parameter name resolving to the desired AMI ID

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Type: String
    Default: ""

  InstanceName:
    Type: String
    Default: k3s
    Description: Name tag value for the EC2 instance

  GitHubRepo:
    Description: GitHub repository in owner/name format
    Type: String
    Default: "DAWS25/daws"

  GitHubBranch:
    Description: GitHub branch to download
    Type: String
    Default: "main"
  
  UserDataPath:
    Description: Path to user data script within the GitHub repository
    Type: String
    Default: "user-data/k3s/user-data.sh"

  DetailedMonitoring:
    Type: String
    Default: "false"
    AllowedValues: ["true","false"]
    Description: Enable CloudWatch detailed monitoring for the instance [+- 2.10/instance/month]

  VolumeSize:
    Type: Number
    Default: 64
  
  VolumeType:
    Type: String
    Default: gp3

  K3sPort:
    Type: Number
    Default: 6443

  K3sIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to access the k3s API port
  
  ArtifactsBucketName:
    Type: String
    Description: Name of the S3 bucket for storing build artifacts
  

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  UserDataLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ec2/${TenantId}/${EnvId}/${InstanceName}/user-data
      RetentionInDays: 14

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP and SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref K3sPort
          ToPort: !Ref K3sPort
          CidrIp: !Ref K3sIngressCidr

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: S3ArtifactsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub
                    - arn:aws:s3:::${ArtifactsBucket}
                    - ArtifactsBucket: !ImportValue
                        Fn::Sub: ${TenantId}-${EnvId}-ArtifactsBucketName
                  - !Sub
                    - arn:aws:s3:::${ArtifactsBucket}/*
                    - ArtifactsBucket: !ImportValue
                        Fn::Sub: ${TenantId}-${EnvId}-ArtifactsBucketName
        - PolicyName: Ec2DescribeTagsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-${EnvId}-k3s-instance-role
        - Key: TenantId
          Value: !Sub ${TenantId}
        - Key: EnvId
          Value: !Sub ${EnvId}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      ImageId: !Sub "{{resolve:ssm:${AmiSsmParameter}}}"
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
        - Fn::ImportValue:
            !Sub ${TenantId}-${EnvId}-AdminSecurityGroupId
      Monitoring: !Ref DetailedMonitoring
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: TenantId
          Value: !Sub ${TenantId}
        - Key: EnvId
          Value: !Sub ${EnvId}
        - Key: ARTIFACTS_BUCKET
          Value: !Ref ArtifactsBucketName
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: !Ref VolumeSize
          VolumeType: !Ref VolumeType
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -ex
          # Set variables from CloudFormation parameters
          USER_DATA_LOG="/home/ec2-user/user-data.log"
          CW_CONFIG_PATH="/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json"
          USER_DATA_PATH="${UserDataPath}"
          GIT_REPO="${GitHubRepo}"
          REPO_NAME=$(echo "$GIT_REPO" | awk -F/ '{print $NF}')
          GIT_BRANCH="${GitHubBranch}"
          ARTIFACTS_BUCKET_NAME="${ArtifactsBucketName}"
          # Export variables for use in user data script
          export USER_DATA_PATH
          export GIT_REPO
          export REPO_NAME
          export GIT_BRANCH
          export ARTIFACTS_BUCKET_NAME
          # Validation of critical parameters
          if [ -z "$USER_DATA_PATH" ] || [ -z "$GIT_REPO" ] || [ -z "$GIT_BRANCH" ]; then
            echo "VALIDATION ERROR: UserDataPath, GitHubRepo, and GitHubBranch must be defined and non-empty" | tee -a "$USER_DATA_LOG"
            exit 1
          fi
          # Instance setup
          echo "User data script started for [$USER_DATA_PATH]@$[GIT_REPO:$GIT_BRANCH]" | tee -a "$USER_DATA_LOG"
          echo "Artifacts bucket: $ARTIFACTS_BUCKET_NAME" | tee -a "$USER_DATA_LOG"
          yum update -y
          yum install -y unzip amazon-cloudwatch-agent
          mkdir -p "$(dirname "$CW_CONFIG_PATH")"
          cat > "$CW_CONFIG_PATH" <<'EOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/home/ec2-user/user-data.log",
                      "log_group_name": "${UserDataLogGroup}",
                      "log_stream_name": "${!aws:InstanceId}/user-data",
                      "timezone": "UTC"
                    }
                  ]
                }
              }
            }
          }
          EOF
          systemctl enable amazon-cloudwatch-agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:"$CW_CONFIG_PATH"
          systemctl restart amazon-cloudwatch-agent
          # Userland setup
          cd /home/ec2-user
          echo "Downloading repository from GitHub: $GIT_REPO branch $GIT_BRANCH" | tee -a "$USER_DATA_LOG"
          curl -fsSL https://github.com/$GIT_REPO/archive/refs/heads/$GIT_BRANCH.zip -o repo.zip
          unzip repo.zip
          cd $REPO_NAME-$GIT_BRANCH
          echo "Executing user data script from $USER_DATA_PATH" | tee -a "$USER_DATA_LOG"
          sudo -u ec2-user -E bash -lc "bash '$USER_DATA_PATH'" 2>&1 | tee -a "$USER_DATA_LOG"
          systemctl restart amazon-cloudwatch-agent
          echo "User data cleanup" | tee -a "$USER_DATA_LOG"
          rm -f repo.zip
          echo "User data script executed successfully" | tee -a "$USER_DATA_LOG"
          
Outputs:
  UserDataLogGroupName:
    Description: CloudWatch Logs group name for EC2 user-data log
    Value: !Ref UserDataLogGroup
  UserDataLogStreamName:
    Description: CloudWatch Logs stream name pattern for EC2 user-data log
    Value: !Sub "${!aws:InstanceId}/user-data"
  InstancePublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt Instance.PublicIp
  WebURL:
    Description: URL to access the web server
    Value: !Sub "http://${Instance.PublicDnsName}/"
  Ec2InstanceConnectURL:
    Description: EC2 Instance Connect URL for browser-based SSH
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/ec2-instance-connect/ssh/home?region=${AWS::Region}&connType=standard&instanceId=${Instance}&osUser=ec2-user&sshPort=22&addressFamily=ipv4"