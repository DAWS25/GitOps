Description: EC2 instance running k3s [1517]

Parameters:
  TenantId:
    Type: String
    Default: Main
  
  EnvId:
    Type: String
    Default: Main

  InstanceType:
    Type: String
    Default: t4g.small

  AmiSsmParameter:
    Type: String
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: SSM parameter name resolving to the desired AMI ID

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Type: String
    Default: ""

  InstanceName:
    Type: String
    Default: k3s
    Description: Name tag value for the EC2 instance

  GitHubRepo:
    Description: GitHub repository in owner/name format
    Type: String
    Default: "DAWS25/daws"

  GitHubBranch:
    Description: GitHub branch to download
    Type: String
    Default: "main"
  
  UserDataPath:
    Description: Path to user data script within the GitHub repository
    Type: String
    Default: "user-data/k3s/user-data.sh"

  DetailedMonitoring:
    Type: String
    Default: "false"
    AllowedValues: ["true","false"]
    Description: Enable CloudWatch detailed monitoring for the instance [+- 2.10/instance/month]

  VolumeSize:
    Type: Number
    Default: 64
  
  VolumeType:
    Type: String
    Default: gp3

  K3sPort:
    Type: Number
    Default: 6443
  

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP and SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref K3sPort
          ToPort: !Ref K3sPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  K3sInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: S3ArtifactsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub
                    - arn:aws:s3:::${ArtifactsBucket}
                    - ArtifactsBucket: !ImportValue
                        Fn::Sub: ${TenantId}-${EnvId}-GitopsArtifactsBucketName
                  - !Sub
                    - arn:aws:s3:::${ArtifactsBucket}/*
                    - ArtifactsBucket: !ImportValue
                        Fn::Sub: ${TenantId}-${EnvId}-GitopsArtifactsBucketName
        - PolicyName: Ec2DescribeTagsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub ${TenantId}-${EnvId}-k3s-instance-role
        - Key: TenantId
          Value: !Sub ${TenantId}
        - Key: EnvId
          Value: !Sub ${EnvId}

  K3sInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref K3sInstanceRole

  K3sInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      ImageId: !Sub "{{resolve:ssm:${AmiSsmParameter}}}"
      IamInstanceProfile: !Ref K3sInstanceProfile
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Monitoring: !Ref DetailedMonitoring
      Tags:
        - Key: Name
          Value: !Ref InstanceName
        - Key: TenantId
          Value: !Sub ${TenantId}
        - Key: EnvId
          Value: !Sub ${EnvId}
        - Key: ARTIFACTS_BUCKET
          Value: !ImportValue
            Fn::Sub: ${TenantId}-${EnvId}-GitopsArtifactsBucketName
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: !Ref VolumeSize
          VolumeType: !Ref VolumeType
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          USER_DATA_LOG="/home/ec2-user/user-data.log"
          USER_DATA_PATH="${UserDataPath}"
          GIT_REPO="${GitHubRepo}"
          REPO_NAME=$(echo "$GIT_REPO" | awk -F/ '{print $NF}')
          GIT_BRANCH="${GitHubBranch}"
          if [ -z "$USER_DATA_PATH" ] || [ -z "$GIT_REPO" ] || [ -z "$GIT_BRANCH" ]; then
            echo "VALIDATION ERROR: UserDataPath, GitHubRepo, and GitHubBranch must be defined and non-empty" | tee -a "$USER_DATA_LOG"
            exit 1
          fi
          echo "User data script started for [$USER_DATA_PATH]" | tee -a "$USER_DATA_LOG"
          yum update -y
          yum install -y unzip curl
          cd /home/ec2-user
          echo "Downloading repository from GitHub: $GIT_REPO branch $GIT_BRANCH" | tee -a "$USER_DATA_LOG"
          curl -fsSL https://github.com/$GIT_REPO/archive/refs/heads/$GIT_BRANCH.zip -o repo.zip
          unzip repo.zip
          cd $REPO_NAME-$GIT_BRANCH
          echo "Executing user data script from $USER_DATA_PATH" | tee -a "$USER_DATA_LOG"
          source "$USER_DATA_PATH" | tee -a "$USER_DATA_LOG"
          echo "User data script execution completed" | tee -a "$USER_DATA_LOG"
          rm -f repo.zip
          echo "User data script executed successfully" | tee -a "$USER_DATA_LOG"
          
Outputs:
  InstancePublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt K3sInstance.PublicIp
  WebURL:
    Description: URL to access the web server
    Value: !Sub "http://${K3sInstance.PublicDnsName}/"
  Ec2InstanceConnectURL:
    Description: EC2 Instance Connect URL for browser-based SSH
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/ec2-instance-connect/ssh/home?region=${AWS::Region}&connType=standard&instanceId=${K3sInstance}&osUser=ec2-user&sshPort=22&addressFamily=ipv4"