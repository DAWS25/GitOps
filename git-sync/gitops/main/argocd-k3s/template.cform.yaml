Description: EC2 instance running ArgoCD on k3s

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small

  AmiSsmParameter:
    Type: String
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-arm64-gp2
    Description: SSM parameter name resolving to the desired AMI ID

  KeyName:
    Description: Name of an existing EC2 KeyPair to enable SSH access
    Type: String
    Default: ""

  GitHubUser:
    Description: GitHub username owning the repo
    Type: String
    Default: "DAWS25"

  GitHubRepo:
    Description: GitHub repository name
    Type: String
    Default: "daws"

  DetailedMonitoring:
    Type: String
    Default: "false"
    AllowedValues: ["true","false"]
    Description: Enable CloudWatch detailed monitoring for the instance [+- 2.10/instance/month]

  VolumeSize:
    Type: Number
    Default: 64
  
  VolumeType:
    Type: String
    Default: gp3
  
  ArgoCDPort:
    Type: String
    Default: 12746

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP and SSH access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ArgoCDPort
          ToPort: !Ref ArgoCDPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  ArgoCDK3sInstance20260322:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      ImageId: !Sub "{{resolve:ssm:${AmiSsmParameter}}}"
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Monitoring: !Ref DetailedMonitoring
      Tags:
        - Key: Name
          Value: ArgoCDK3sInstance
      BlockDeviceMappings:
      - DeviceName: /dev/xvda
        Ebs:
          VolumeSize: !Ref VolumeSize
          VolumeType: !Ref VolumeType
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          USER_DATA_PATH="user-data/argocd-k3s/user-data.sh"
          ##
          echo "User data script started" | tee -a /home/ec2-user/user-data.log
          yum update -y
          yum install -y unzip python3 wget
          cd /home/ec2-user
          echo "Downloading repository from GitHub: ${GitHubUser}/${GitHubRepo}" | tee -a /home/ec2-user/user-data.log
          wget https://github.com/${GitHubUser}/${GitHubRepo}/archive/refs/heads/main.zip -O ${GitHubRepo}-main.zip
          unzip ${GitHubRepo}-main.zip
          cd ${GitHubRepo}-main
          echo "Executing user data script from $USER_DATA_PATH" | tee -a /home/ec2-user/user-data.log
          source $USER_DATA_PATH
          echo "User data script executed successfully" | tee -a /home/ec2-user/user-data.log

Outputs:
  InstancePublicIP:
    Description: Public IP of the EC2 instance
    Value: !GetAtt ArgoCDK3sInstance20260322.PublicIp
  WebURL:
    Description: URL to access the web server
    Value: !Sub "http://${ArgoCDK3sInstance20260322.PublicDnsName}/"